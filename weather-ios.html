<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a6fd6">
<title>آب‌وهوای قندیل</title>
<style>
:root{--top:#2a6fd6;--bot:#79b8f5}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
@font-face{font-family:SysEmoji;src:local("Apple Color Emoji"),local("Segoe UI Emoji"),local("Noto Color Emoji"),local("Twemoji Mozilla");unicode-range:U+00A9,U+00AE,U+200D,U+203C-3299,U+FE0F,U+1F000-1FAFF}
body{font-family:SysEmoji,Vazirmatn,-apple-system,system-ui,sans-serif;color:#fff;min-height:100vh;background:linear-gradient(180deg,var(--top),var(--bot)) fixed;transition:background .6s}
.wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 40px}
.search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);border-radius:12px;padding:0 12px;border:1px solid rgba(255,255,255,.18);box-shadow:0 5px 16px rgba(0,0,0,.08)}
.search input{flex:1;min-width:0;background:none;border:0;color:#fff;font:inherit;font-size:16px;padding:10px 0;outline:none}
.search input::placeholder{color:rgba(255,255,255,.65)}
.search button{background:none;border:0;font-size:18px;cursor:pointer;padding:4px}
#sug{list-style:none;padding:0;margin-top:8px;background:rgba(20,30,50,.55);border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.16)}
#sug li{padding:12px 16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.15)}
#sug li:last-child{border:0}
:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:8px}
.h i,.day .i{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",SysEmoji,sans-serif;font-variant-emoji:emoji;font-style:normal}
.mini{position:fixed;top:0;left:0;right:0;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 10px;opacity:0;pointer-events:none;z-index:5;background:linear-gradient(var(--top),transparent);font-weight:600}
.mini small{display:block;font-weight:400;font-size:13px;opacity:.9}
.hero{text-align:center;padding:44px 0 34px}
.city{font-size:32px;font-weight:400}
.temp{font-size:104px;font-weight:200;line-height:1.1;margin-top:2px;padding-right:.2em}
.cond{font-size:20px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.12)}
.hl{font-size:18px;margin-top:2px}
.card{background:rgba(255,255,255,.17);border-radius:20px;padding:12px 16px 14px;margin-top:12px;border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.card h2{font-size:13px;font-weight:600;opacity:.72;margin-bottom:10px;display:flex;gap:6px;align-items:center}
.card h2+.hr{margin:-4px 0 10px;border:0;border-top:1px solid rgba(255,255,255,.2)}
.sum{font-size:14px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.2)}
.scroll{overflow-x:auto;scrollbar-width:none;margin:0 -6px}
.hours{display:flex;min-width:max-content;padding:0 2px}
.h{width:58px;text-align:center;font-size:14px;font-weight:600}
.h i{display:block;font-style:normal;font-size:24px;margin:8px 0 6px}
.h span{font-weight:400;opacity:.9}
.day{display:grid;grid-template-columns:62px 30px 36px 1fr 36px;align-items:center;gap:6px;padding:11px 0;border-top:1px solid rgba(255,255,255,.2);font-size:16px}
.day:first-of-type{border:0;padding-top:2px}
.day b{font-weight:600}.day .i{font-size:22px;text-align:center}
.day .lo{opacity:.62;text-align:left;direction:ltr}.day .hi{text-align:right;direction:ltr;font-weight:600}
.bar{height:5px;border-radius:9px;background:rgba(0,0,0,.2);position:relative;direction:ltr}
.bar u{position:absolute;top:0;bottom:0;border-radius:9px}
.bar s{position:absolute;top:-1.5px;width:8px;height:8px;border-radius:50%;background:#fff;border:1.5px solid rgba(0,0,0,.35);margin-left:-4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
 .grid .card{margin:0;min-height:158px;display:flex;flex-direction:column}
.rain-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.rain-summary strong{font-size:27px;font-weight:600}
.rain-track{height:6px;border-radius:8px;background:rgba(0,0,0,.18);overflow:hidden;margin:9px 0}
.rain-track i{display:block;height:100%;border-radius:8px;background:#38c7f5}
.rain-meta{font-size:12px;opacity:.85;line-height:1.8}
.h small{display:block;font-size:10px;opacity:.78;margin-top:3px}
.day b small{display:block;font-size:10px;color:#bcecff;font-weight:400;white-space:nowrap}
.rain-alert{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rain-alert button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:8px 10px;font:inherit;font-size:12px}
.big{font-size:34px;font-weight:400;line-height:1.2}
.lvl{font-size:19px;font-weight:600}
.note{font-size:13px;margin-top:auto;opacity:.9}
.uv{height:5px;border-radius:9px;margin:10px 0;background:linear-gradient(90deg,#3ec46d,#f5d63d,#f5963d,#e8453c,#a24bd6);position:relative;direction:ltr}
.uv s{position:absolute;top:-1.5px;width:8px;height:8px;border-radius:50%;background:#fff;border:1.5px solid rgba(0,0,0,.3);margin-left:-4px}
#msg{text-align:center;padding:90px 0;opacity:.9}
@media(prefers-reduced-motion:reduce){body{transition:none}}
</style>
</head>
<body>
<div class="mini" id="mini"><span id="mc"></span><small id="mt"></small></div>
<div class="wrap">
  <form class="search" id="f"><span>🔍</span><input id="q" placeholder="جستجوی شهر در ایران…" autocomplete="off" aria-label="جستجوی شهر"><button type="button" id="loc" aria-label="موقعیت من">📍</button></form>
  <ul id="sug" hidden></ul>
  <div id="msg">در حال دریافت اطلاعات…</div>
  <main id="app" hidden>
    <section class="hero" id="hero">
      <div class="city" id="city"></div>
      <div class="temp" id="temp"></div>
      <div class="cond" id="cond"></div>
      <div class="hl" id="hl"></div>
    </section>
    <section class="card"><h2>🕐 پیش‌بینی ساعتی</h2><hr class="hr"><div class="scroll"><div class="hours" id="hours"></div></div></section>
    <section class="card"><h2>☔ پیش‌بینی بارش</h2><hr class="hr"><div id="rain"></div></section>
    <section class="card"><h2>📅 پیش‌بینی ۷ روزه</h2><hr class="hr"><div id="days"></div></section>
    <div class="grid" id="stats"></div>
  </main>
</div>
<script>
const fa=n=>Math.round(n).toLocaleString('fa-IR');
const fa1=n=>Number(n||0).toLocaleString('fa-IR',{maximumFractionDigits:1});
const dg=s=>String(s).replace(/\d/g,x=>'۰۱۲۳۴۵۶۷۸۹'[x]);
const W={0:['آسمان صاف','☀️','c'],1:['کم‌ابر','🌤️','c'],2:['نیمه‌ابری','⛅','p'],3:['ابری','☁️','o'],45:['مه‌آلود','🌫️','o'],48:['مه یخی','🌫️','o'],
51:['نم‌نم باران','🌦️','r'],53:['نم‌نم باران','🌦️','r'],55:['نم‌نم باران','🌦️','r'],61:['باران ملایم','🌧️','r'],63:['باران','🌧️','r'],65:['باران شدید','🌧️','r'],
71:['برف ملایم','🌨️','s'],73:['برف','❄️','s'],75:['برف سنگین','❄️','s'],80:['رگبار','🌦️','r'],81:['رگبار','🌧️','r'],82:['رگبار شدید','⛈️','r'],95:['رعدوبرق','⛈️','t'],96:['رعدوبرق و تگرگ','⛈️','t'],99:['رعدوبرق و تگرگ','⛈️','t']};
const w=c=>W[c]||['نامشخص','🌡️','o'];
const SKY={c:{d:['#2a6fd6','#79b8f5'],n:['#0b1230','#273a73']},p:{d:['#3a73c4','#8fb4de'],n:['#121a3a','#33447a']},o:{d:['#6d7b8f','#a7b2c1'],n:['#1a202e','#3a4457']},
r:{d:['#445a7a','#8196b4'],n:['#0f1626','#2a3855']},s:{d:['#6e88ad','#c5d6ea'],n:['#1c2744','#47598a']},t:{d:['#2b2c4a','#5d5683'],n:['#090a1a','#292447']}};
const ST=[[-10,[90,200,250]],[5,[100,210,230]],[15,[130,220,120]],[25,[250,215,80]],[35,[255,150,50]],[45,[255,80,60]]];
function tc(t){let i=0;while(i<ST.length-2&&t>ST[i+1][0])i++;const[a,A]=ST[i],[b,B]=ST[i+1],k=Math.max(0,Math.min(1,(t-a)/(b-a)));return `rgb(${A.map((v,j)=>Math.round(v+(B[j]-v)*k)).join()})`}
const dn=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const $=id=>document.getElementById(id);
const get=async (u,options={})=>{const r=await fetch(u,options);if(!r.ok)throw 0;return r.json()};
let activePlace={lat:36.6959,lon:45.1413,name:'پیرانشهر'};
let loadController=null,loadSequence=0,lastNetworkRefresh=0;
async function load(lat,lon,name,{force=false}={}){
  activePlace={lat,lon,name};
  const cacheKey=`qandil-weather-${lat.toFixed(3)}-${lon.toFixed(3)}`;
  let cached=null;
  try{cached=JSON.parse(localStorage.getItem(cacheKey)||'null')}catch(e){}
  const cacheAge=cached?.saved?Date.now()-cached.saved:Infinity;
  if(cached?.data){render(cached.data,name);if(cacheAge<10*60*1000&&!force)return;}
  else{$('msg').hidden=false;$('msg').textContent='در حال دریافت اطلاعات…';$('app').hidden=true;}
  if(loadController)loadController.abort();
  loadController=new AbortController();
  const seq=++loadSequence;
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,weather_code,precipitation_probability,precipitation&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max,sunrise,sunset,precipitation_probability_max,precipitation_sum,rain_sum,showers_sum&timezone=auto&forecast_days=7`;
  try{
    const data=await get(url,{signal:loadController.signal});
    if(seq!==loadSequence)return;
    render(data,name);lastNetworkRefresh=Date.now();
    try{localStorage.setItem(cacheKey,JSON.stringify({saved:Date.now(),data}))}catch(e){}
  }catch(e){
    if(e.name==='AbortError')return;
    if(!cached?.data){$('msg').hidden=false;$('msg').textContent='خطا در دریافت اطلاعات آب‌وهوا. اینترنت را بررسی کنید 📡';}
  }
}
function maybeNotifyRain(name,d,startIndex){
  const probs=d.hourly.precipitation_probability.slice(startIndex,startIndex+6);
  const amounts=d.hourly.precipitation.slice(startIndex,startIndex+6);
  const idx=probs.findIndex((v,j)=>Number(v)>=60||Number(amounts[j]||0)>=0.2);
  if(idx<0)return;
  const day=d.current.time.slice(0,10);
  const key='qandil-rain-'+name+'-'+day;
  try{if(localStorage.getItem(key))return}catch(e){}
  const title='بارش در پیش است ☔';
  const at=dg(d.hourly.time[startIndex+idx].slice(11,16));
  const body=`برای ${name} حدود ساعت ${at} احتمال بارش ${fa(probs[idx])}٪ و بارش ${fa1(amounts[idx])} میلی‌متر پیش‌بینی شده است.`;
  let sent=false;
  try{
    const bridge=window.AndroidBridge;
    if(bridge&&typeof bridge.showNativeNotification==='function'){
      sent=bridge.showNativeNotification(title,body,key)===true;
    }
  }catch(e){}
  if(!sent&&'Notification' in window&&Notification.permission==='granted'){
    try{new Notification(title,{body});sent=true}catch(e){}
  }
  if(sent){try{localStorage.setItem(key,'1')}catch(e){}}
}
function render(d,name){
  const c=d.current,[txt,ico,k]=w(c.weather_code),sky=SKY[k][c.is_day?'d':'n'],D=d.daily;
  const r=document.documentElement.style;r.setProperty('--top',sky[0]);r.setProperty('--bot',sky[1]);
  document.querySelector('meta[name=theme-color]').content=sky[0];
  $('city').textContent=name;$('temp').textContent=fa(c.temperature_2m)+'°';$('cond').textContent=txt;
  $('hl').textContent=`بیشینه ${fa(D.temperature_2m_max[0])}°  کمینه ${fa(D.temperature_2m_min[0])}°`;
  $('mc').textContent=name;$('mt').textContent=`${fa(c.temperature_2m)}° | ${txt}`;
  const now=c.time.slice(0,13);let i=d.hourly.time.findIndex(t=>t.slice(0,13)===now);if(i<0)i=0;
  $('hours').innerHTML=d.hourly.time.slice(i,i+24).map((t,j)=>`<div class="h"><span>${j?dg(+t.slice(11,13)):'اکنون'}</span><i>${w(d.hourly.weather_code[i+j])[1]}</i>${fa(d.hourly.temperature_2m[i+j])}°<small>☔ ${fa(d.hourly.precipitation_probability[i+j]||0)}٪</small></div>`).join('');
  const mn=Math.min(...D.temperature_2m_min),mx=Math.max(...D.temperature_2m_max),sp=(mx-mn)||1;
  $('days').innerHTML=D.time.map((t,j)=>{
    const lo=D.temperature_2m_min[j],hi=D.temperature_2m_max[j],l=(lo-mn)/sp*100,wd=Math.max((hi-lo)/sp*100,5);
    const dot=j?'':`<s style="left:${Math.min(Math.max((c.temperature_2m-mn)/sp*100,0),100)}%"></s>`;
    return `<div class="day"><b>${j?dn[new Date(t+'T12:00').getDay()]:'امروز'}<small>☔ ${fa(D.precipitation_probability_max[j]||0)}٪ · ${fa1(D.precipitation_sum[j]||0)} mm</small></b><span class="i">${w(D.weather_code[j])[1]}</span><span class="lo">${fa(lo)}°</span><div class="bar"><u style="left:${l}%;width:${wd}%;background:linear-gradient(90deg,${tc(lo)},${tc(hi)})"></u>${dot}</div><span class="hi">${fa(hi)}°</span></div>`}).join('');
  const tm=s=>dg(+s.slice(11,13))+':'+dg(s.slice(14,16));
  const uv=D.uv_index_max[0],ul=uv<3?'کم':uv<6?'متوسط':uv<8?'زیاد':uv<11?'خیلی زیاد':'شدید';
  const ws=c.wind_speed_10m,df=c.apparent_temperature-c.temperature_2m,hm=c.relative_humidity_2m;
  const cd=(h,b,x,n)=>`<div class="card"><h2>${h}</h2>${b}<div class="note">${n}</div></div>`;
  const rainHours=d.hourly.precipitation_probability.slice(i,i+12);
  const rainAmounts=d.hourly.precipitation.slice(i,i+12);
  const maxRain=Math.max(0,...rainHours);
  const rainIndex=rainHours.findIndex(v=>v>=50);
  const rainTime=rainIndex>=0?tm(d.hourly.time[i+rainIndex]):'در ۱۲ ساعت آینده';
  const rainAmount=rainAmounts.reduce((a,v)=>a+(v||0),0);
  $('rain').innerHTML=`<div class="rain-summary"><span>${maxRain>=50?'احتمال بارش در ساعات آینده':'احتمال بارش در ۱۲ ساعت آینده'}</span><strong>${fa(maxRain)}٪</strong></div><div class="rain-track"><i style="width:${Math.min(maxRain,100)}%"></i></div><div class="rain-meta">${rainIndex>=0?'زمان احتمالی شروع: '+rainTime:'بارش قابل‌توجهی پیش‌بینی نشده'} · مجموع بارش پیش‌بینی‌شده: ${fa1(rainAmount)} میلی‌متر</div><div class="rain-alert"><span>🔔 اعلان بارش</span><button type="button" id="rainPermission">فعال‌سازی اعلان</button></div>`;
  maybeNotifyRain(name,d,i);
  $('stats').innerHTML=
   cd('☀️ شاخص UV',`<div class="big">${fa(uv)}</div><div class="lvl">${ul}</div><div class="uv"><s style="left:${Math.min(uv/11,1)*100}%"></s></div>`,0,'بیشینه امروز')+
   cd('🌇 غروب',`<div class="big">${tm(D.sunset[0])}</div>`,0,'طلوع: '+tm(D.sunrise[0]))+
   cd('💨 باد',`<div class="big">${fa(ws)}</div><div class="lvl">کیلومتر بر ساعت</div>`,0,ws<12?'نسیم ملایم':ws<30?'باد متوسط':'باد قوی')+
   cd('🌡️ حس واقعی',`<div class="big">${fa(c.apparent_temperature)}°</div>`,0,df>1?'گرم‌تر از دمای واقعی':df<-1?'سردتر از دمای واقعی':'نزدیک به دمای واقعی')+
   cd('💧 رطوبت',`<div class="big">${fa(hm)}٪</div>`,0,hm<30?'هوای خشک':hm<60?'رطوبت مطلوب':'هوای مرطوب')+
   cd('☔ احتمال بارش',`<div class="big">${fa(D.precipitation_probability_max[0]||0)}٪</div>`,0,'بیشینه امروز');
  $('msg').hidden=true;$('app').hidden=false;onScroll();
}
function onScroll(){const p=Math.min(Math.max((scrollY-70)/110,0),1);$('mini').style.opacity=p;$('hero').style.opacity=1-p*.9}
let scrollQueued=false;addEventListener('scroll',()=>{if(scrollQueued)return;scrollQueued=true;requestAnimationFrame(()=>{onScroll();scrollQueued=false})},{passive:true});
document.addEventListener('click',async e=>{if(e.target.id!=='rainPermission')return;try{if(window.AndroidBridge&&typeof AndroidBridge.requestNotificationPermission==='function'){const result=AndroidBridge.requestNotificationPermission();e.target.textContent=result==='granted'?'اعلان‌ها در سیستم فعال هستند':result==='settings'?'لطفاً اعلان قندیل را در تنظیمات فعال کنید':result==='requested'?'درخواست مجوز نمایش داده می‌شود':'امکان درخواست مجوز نیست';}else if('Notification' in window){const p=await Notification.requestPermission();e.target.textContent=p==='granted'?'اعلان فعال شد':'اجازه داده نشد';}else{e.target.textContent='اعلان سیستم پشتیبانی نمی‌شود';}}catch(err){e.target.textContent='فعال‌سازی ممکن نشد';}});
let tm,searchController,searchSeq=0;
function showSearchMessage(message){const s=$('sug');s.replaceChildren();const li=document.createElement('li');li.textContent=message;li.style.cursor='default';s.append(li);s.hidden=false}
$('q').addEventListener('input',e=>{
  clearTimeout(tm);if(searchController)searchController.abort();
  const v=e.target.value.trim(),seq=++searchSeq;
  if(v.length<2){$('sug').hidden=true;$('sug').replaceChildren();return}
  tm=setTimeout(async()=>{
    searchController=new AbortController();
    try{
      const url=`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=100&language=fa&countryCode=IR&format=json`;
      const r=await get(url,{signal:searchController.signal});
      if(seq!==searchSeq||$('q').value.trim()!==v)return;
      const s=$('sug');s.replaceChildren();
      const results=(r.results||[]).filter(x=>x.country_code==='IR'||x.country==='Iran');
      if(!results.length){showSearchMessage('شهری با این نام در ایران پیدا نشد');return}
      results.forEach(x=>{
        const li=document.createElement('li');
        const province=x.admin1?`، ${x.admin1}`:'';
        li.textContent=`${x.name}${province}`;
        li.dataset.lat=x.latitude;li.dataset.lon=x.longitude;li.dataset.name=x.name;
        s.append(li);
      });
      s.hidden=false;
    }catch(e){if(e.name!=='AbortError'&&seq===searchSeq)showSearchMessage('جست‌وجو انجام نشد؛ اتصال اینترنت را بررسی کنید')}
  },280);
});
$('sug').addEventListener('click',e=>{
  const li=e.target.closest('li');if(!li||!li.dataset.lat)return;
  $('sug').hidden=true;$('q').value='';
  load(Number(li.dataset.lat),Number(li.dataset.lon),li.dataset.name);
});
$('f').addEventListener('submit',e=>{e.preventDefault();const first=$('sug').querySelector('li[data-lat]');if(first)first.click()});
async function qandilUseCoordinates(latitude,longitude){
  let city='موقعیت من';
  try{
    const r=await get(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=fa`);
    city=r.city||r.locality||r.localityInfo?.administrative?.[2]?.name||r.principalSubdivision||city;
  }catch(e){}
  $('loc').disabled=false;load(latitude,longitude,city);
}
window.onQandilNativeLocation=(lat,lon,accuracy)=>qandilUseCoordinates(Number(lat),Number(lon));
window.onQandilNativeLocationError=(reason)=>{
  $('loc').disabled=false;$('msg').hidden=false;$('app').hidden=true;
  $('msg').textContent=reason==='permission'?'مجوز مکان داده نشد؛ از تنظیمات برنامه دسترسی مکان را فعال کنید.':reason==='timeout'?'موقعیت پیدا نشد؛ GPS را روشن کنید و در فضای باز دوباره امتحان کنید.':'مکان‌یابی انجام نشد؛ GPS و دسترسی مکان را بررسی کنید.';
};
$('loc').onclick=()=>{
  $('loc').disabled=true;$('msg').hidden=false;$('msg').textContent='در حال دریافت موقعیت مکانی…';$('app').hidden=true;
  if(window.AndroidBridge&&typeof AndroidBridge.requestNativeLocation==='function'){
    try{AndroidBridge.requestNativeLocation();}catch(e){window.onQandilNativeLocationError('unavailable');}
    return;
  }
  if(!navigator.geolocation){window.onQandilNativeLocationError('unavailable');return;}
  navigator.geolocation.getCurrentPosition(p=>qandilUseCoordinates(p.coords.latitude,p.coords.longitude),err=>{
    window.onQandilNativeLocationError(err.code===1?'permission':err.code===3?'timeout':'unavailable');
  },{enableHighAccuracy:true,timeout:18000,maximumAge:300000});
};

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastNetworkRefresh>30*60*1000)load(activePlace.lat,activePlace.lon,activePlace.name,{force:true})});
