name: Build Piranshahr Weather APK

on:
  push:
    branches: [ main ]
    paths:
      - 'PiranshahrWeather-GitHub.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          test -f PiranshahrWeather-GitHub.zip
          unzip -q -o PiranshahrWeather-GitHub.zip -d .
          test -f piranshahr-weather-android/settings.gradle.kts
          test -f piranshahr-weather-android/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        working-directory: piranshahr-weather-android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Piranshahr-Weather-APK
          path: piranshahr-weather-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Piranshahr Weather APK
          body: Automatically built from the uploaded Android project.
          make_latest: true
          files: piranshahr-weather-android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
