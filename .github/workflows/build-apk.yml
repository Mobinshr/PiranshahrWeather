name: Build Piranshahr Weather APK
on:
  push:
    branches:
      - main
    paths:
      - 'PiranshahrWeather-GitHub.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          test -f PiranshahrWeather-GitHub.zip
          unzip -q -o PiranshahrWeather-GitHub.zip -d .
          test -f piranshahr-weather-android/settings.gradle.kts
          test -f piranshahr-weather-android/app/src/main/AndroidManifest.xml

      - name: Apply Material 3 weather interface
        working-directory: piranshahr-weather-android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path("app/src/main/assets/weather.html")
          html = page.read_text(encoding="utf-8")
          marker = "</style>"
          if html.count(marker) != 1:
              raise SystemExit("Expected exactly one style closing tag in weather.html")

          css = r"""
          /* Weather UI redesign v1.0.2 — layout and visual system only. */
          :root {
              color-scheme: dark;
              --bg:#0b1220;
              --surface:#121d31;
              --surface-2:#1b2a43;
              --border:rgba(157,180,216,.16);
              --text:#f2f6ff;
              --muted:#9aabc5;
              --accent:#ffc85a;
              --accent-2:#ff9864;
              --success:#71d99a;
              --info:#79c6ff;
              --radius:24px;
              --radius-sm:18px;
          }
          html { background:var(--bg); }
          body {
              background:
                  radial-gradient(ellipse at 50% -12%, rgba(76,119,190,.27), transparent 48%),
                  radial-gradient(ellipse at 100% 38%, rgba(255,173,87,.07), transparent 36%),
                  var(--bg);
              padding:22px 16px 42px;
              padding-top:max(22px,env(safe-area-inset-top));
          }
          .app { max-width:760px; gap:22px; }
          header {
              padding:10px 12px;
              border:1px solid var(--border);
              border-radius:22px;
              background:rgba(18,29,49,.82);
              box-shadow:0 10px 30px rgba(0,0,0,.16);
              backdrop-filter:blur(18px);
              -webkit-backdrop-filter:blur(18px);
          }
          .location { gap:12px; }
          .location-icon {
              width:46px;height:46px;border-radius:16px;
              color:#182338;
              background:linear-gradient(145deg,#ffe19a,#ffad61);
              box-shadow:0 6px 18px rgba(255,184,91,.2);
          }
          .city-select { font-size:1.32rem;font-weight:800; }
          .location p { font-size:.75rem; }
          .actions { gap:7px; }
          .icon-btn {
              width:42px;height:42px;border-radius:15px;
              background:var(--surface-2);
              border:1px solid var(--border);
              color:var(--text);
          }
          .icon-btn:hover { background:#263957;border-color:rgba(255,200,90,.4); }
          .install-btn { color:var(--success);background:rgba(113,217,154,.1); }
          .notif-btn.active { color:var(--accent);background:rgba(255,200,90,.12); }
          .hero {
              min-height:238px;
              padding:30px 32px;
              grid-template-columns:1fr auto;
              gap:18px;
              border:1px solid rgba(255,255,255,.11);
              border-radius:30px;
              background:
                  radial-gradient(circle at 82% 48%,rgba(255,190,92,.20),transparent 32%),
                  radial-gradient(circle at 8% 100%,rgba(80,151,231,.22),transparent 48%),
                  linear-gradient(125deg,#1b2d4b 0%,#17243a 48%,#27324a 100%);
              box-shadow:0 20px 48px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08);
          }
          .hero::before {
              content:"وضعیت فعلی";
              position:absolute;top:18px;right:22px;
              padding:6px 11px;border-radius:30px;
              background:rgba(255,255,255,.09);
              border:1px solid rgba(255,255,255,.12);
              color:#dce8fb;font-size:.72rem;font-weight:700;
              letter-spacing:.1px;
          }
          .hero::after {
              content:"";position:absolute;width:190px;height:190px;
              left:-55px;bottom:-105px;border-radius:50%;
              border:1px solid rgba(255,255,255,.08);
              box-shadow:0 0 0 22px rgba(255,255,255,.025),0 0 0 48px rgba(255,255,255,.018);
              pointer-events:none;
          }
          .hero-main { position:relative;z-index:1;gap:7px;padding-top:16px; }
          .hero-temp { font-size:clamp(4rem,15vw,5.4rem);font-weight:850;letter-spacing:-3px;color:#fff; }
          .hero-temp sup { color:#c2d0e5;font-size:1.35rem; }
          .hero-desc { color:#fff;font-size:1.12rem;font-weight:750;margin-top:5px; }
          .hero-feels { color:#c0cde1;font-size:.84rem; }
          .hero-icon {
              position:relative;z-index:1;
              font-size:clamp(5rem,19vw,7.2rem);
              filter:drop-shadow(0 14px 22px rgba(0,0,0,.35));
          }
          .stats { grid-template-columns:repeat(3,minmax(0,1fr));gap:11px; }
          .stat {
              min-height:98px;padding:15px 16px;
              border-radius:20px;
              background:linear-gradient(150deg,#17243a,#121d30);
              border:1px solid var(--border);
              box-shadow:0 8px 22px rgba(0,0,0,.13);
          }
          .stat:hover { transform:translateY(-2px);background:#1c2c45; }
          .stat-label { font-size:.74rem;color:#aabbd3; }
          .stat-value { font-size:1.2rem;color:#f4f7ff; }
          .stat-value .unit { color:#9aabc5; }
          .section { gap:12px; }
          .section-title {
              color:#eaf1fc;font-size:1rem;font-weight:800;
              padding:0 3px;gap:10px;
          }
          .section-title::before {
              width:5px;height:19px;border-radius:8px;
              background:linear-gradient(180deg,#ffd16f,#ff9665);
          }
          .chart-card {
              padding:18px 15px 14px;
              border-radius:23px;
              background:linear-gradient(155deg,#15233a,#111b2d);
              border:1px solid var(--border);
              box-shadow:0 10px 26px rgba(0,0,0,.14);
          }
          .chart-wrap { height:218px; }
          .chart-wrap.precip { height:156px; }
          .hourly-scroll { gap:9px;padding:4px 2px 13px; }
          .hour-card {
              min-width:76px;padding:13px 9px;
              border-radius:19px;
              background:linear-gradient(160deg,#182740,#121e31);
              border:1px solid var(--border);
              gap:8px;
          }
          .hour-card.now {
              background:linear-gradient(160deg,rgba(255,200,90,.19),rgba(255,200,90,.06));
              border:1px solid rgba(255,200,90,.62);
              box-shadow:0 7px 20px rgba(255,190,80,.09);
          }
          .hour-time { font-size:.73rem; }
          .hour-icon { font-size:1.7rem; }
          .hour-temp { font-size:1rem; }
          .daily-list {
              border-radius:23px;
              background:linear-gradient(155deg,#15233a,#111b2d);
              border:1px solid var(--border);
              box-shadow:0 10px 26px rgba(0,0,0,.14);
          }
          .day-row {
              grid-template-columns:76px 34px minmax(70px,1fr) 82px;
              gap:10px;padding:16px 15px;
              border-color:rgba(157,180,216,.12);
          }
          .day-row:hover { transform:none;background:rgba(255,255,255,.035); }
          .day-name { font-size:.84rem;color:#edf3ff; }
          .day-name small { color:#9aabc5; }
          .day-icon { font-size:1.5rem; }
          .day-bar { height:7px;background:#273751; }
          .day-bar-fill { background:linear-gradient(90deg,#6bbdff,#ffc85a,#ff9566); }
          .day-temps { font-size:.82rem; }
          .sun-row { gap:11px; }
          .sun-card {
              padding:17px;border-radius:20px;
              background:linear-gradient(145deg,#192943,#121e31);
              border:1px solid var(--border);
          }
          .sun-card .sun-icon { font-size:1.9rem; }
          .sun-card .sun-label { color:#9aabc5; }
          .sun-card .sun-time { color:#f3f6ff;font-size:1.08rem; }
          .banner,.notif-status,.error-card { border-radius:18px; }
          .notif-status { background:rgba(113,217,154,.09);border-color:rgba(113,217,154,.24); }
          footer {
              padding:15px 5px 4px;
              border-top:1px solid var(--border);
              font-size:.73rem;line-height:1.8;
          }
          .toast { border-radius:16px; }
          button,select,.hour-card { -webkit-tap-highlight-color:transparent; }
          button:focus-visible,select:focus-visible,.hour-card:focus-visible {
              outline:2px solid var(--accent);outline-offset:3px;
          }
          @media (prefers-color-scheme: light) {
              :root {
                  color-scheme:light;
                  --bg:#eef3fa;--surface:#fff;--surface-2:#e8eef7;
                  --border:rgba(54,78,115,.14);--text:#17243a;--muted:#64758f;
                  --accent:#a56a08;--accent-2:#c36b35;--success:#23794c;--info:#2777ac;
              }
              body {
                  background:
                      radial-gradient(ellipse at 50% -12%,rgba(83,129,196,.16),transparent 48%),
                      var(--bg);
              }
              header { background:rgba(255,255,255,.86);box-shadow:0 10px 28px rgba(48,70,105,.08); }
              .location-icon { color:#49310b; }
              .icon-btn { background:#edf2f9;color:#263751; }
              .icon-btn:hover { background:#e1e9f4; }
              .hero {
                  background:
                      radial-gradient(circle at 82% 48%,rgba(255,196,101,.28),transparent 32%),
                      radial-gradient(circle at 8% 100%,rgba(80,151,231,.18),transparent 48%),
                      linear-gradient(125deg,#e2edfc 0%,#d7e5f8 52%,#f8e9d6 100%);
                  border-color:rgba(73,100,143,.13);
                  box-shadow:0 20px 48px rgba(48,70,105,.12);
              }
              .hero-temp,.hero-desc { color:#17243a; }
              .hero-temp sup,.hero-feels { color:#526783; }
              .hero::before { color:#314968;background:rgba(255,255,255,.52);border-color:rgba(73,100,143,.12); }
              .stat,.chart-card,.daily-list,.hour-card,.sun-card {
                  background:#fff;border-color:rgba(54,78,115,.13);
                  box-shadow:0 7px 22px rgba(48,70,105,.06);
              }
              .stat-label,.day-name small,.sun-card .sun-label { color:#64758f; }
              .stat-value,.day-name,.sun-card .sun-time { color:#17243a; }
              .stat-value .unit { color:#64758f; }
              .section-title { color:#243650; }
              .hour-card.now { background:#fff6e5;border-color:#e8bd66; }
              .day-bar { background:#e8eef7; }
              .notif-status { color:#1d392b;background:#e8f6ed;border-color:#c7e8d3; }
              .notif-status-hint { background:#f3f8f4;border-color:#c7e8d3; }
              footer { border-color:rgba(54,78,115,.13); }
          }
          @media (max-width:640px) {
              body { padding:14px 12px 30px;padding-top:max(14px,env(safe-area-inset-top)); }
              .app { gap:17px; }
              header { padding:9px 10px;border-radius:19px; }
              .location-icon { width:42px;height:42px;border-radius:14px; }
              .city-select { font-size:1.12rem;max-width:128px; }
              .location p { font-size:.68rem; }
              .actions { gap:5px; }
              .icon-btn { width:37px;height:37px;border-radius:13px; }
              .icon-btn svg { width:17px;height:17px; }
              .hero { min-height:205px;padding:27px 20px 22px;border-radius:25px; }
              .hero::before { top:13px;right:15px;font-size:.66rem;padding:5px 9px; }
              .hero-main { padding-top:15px; }
              .hero-temp { font-size:3.8rem; }
              .hero-icon { font-size:4.8rem; }
              .stats { grid-template-columns:repeat(2,minmax(0,1fr));gap:9px; }
              .stat { min-height:88px;padding:13px;border-radius:17px; }
              .stat-value { font-size:1.08rem; }
              .section-title { font-size:.92rem; }
              .chart-card { padding:14px 10px 10px;border-radius:19px; }
              .chart-wrap { height:195px; }
              .chart-wrap.precip { height:140px; }
              .hour-card { min-width:70px;padding:12px 8px;border-radius:16px; }
              .day-row { grid-template-columns:62px 27px minmax(45px,1fr) 70px;gap:7px;padding:13px 10px; }
              .day-name { font-size:.77rem; }
              .day-name small { font-size:.64rem; }
              .day-icon { font-size:1.28rem; }
              .day-bar-wrap { gap:5px;font-size:.67rem; }
              .day-temps { gap:4px;font-size:.75rem; }
              .sun-card { padding:14px 12px;gap:9px;border-radius:17px; }
              .sun-card .sun-icon { font-size:1.55rem; }
              .sun-card .sun-time { font-size:.96rem; }
              footer { gap:4px 12px;font-size:.68rem; }
          }
          @media (max-width:360px) {
              .city-select { max-width:108px;font-size:1.03rem; }
              .hero-temp { font-size:3.35rem; }
              .hero-icon { font-size:4.1rem; }
              .day-row { grid-template-columns:56px 24px minmax(38px,1fr) 64px;gap:5px;padding-inline:8px; }
          }
          @media (prefers-reduced-motion:reduce) {
              *,*::before,*::after {
                  animation-duration:.01ms!important;animation-iteration-count:1!important;
                  transition-duration:.01ms!important;scroll-behavior:auto!important;
              }
          }
          """
          html = html.replace(marker, css + "\n" + marker, 1)
          page.write_text(html, encoding="utf-8")
          print("Applied the redesigned weather interface; weather logic is unchanged.")
          PY

      - name: Set Android app version
        working-directory: piranshahr-weather-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("app/build.gradle.kts"), Path("app/build.gradle")]
          gradle_file = next((p for p in candidates if p.is_file()), None)
          if gradle_file is None:
              raise SystemExit("App module Gradle file not found")
          content = gradle_file.read_text()
          content, code_count = re.subn(r"(?m)(\bversionCode\s*(?:=\s*)?)\d+", r'\g<1>4', content, count=1)
          content, name_count = re.subn(r"""(?m)(\bversionName\s*(?:=\s*)?)["'][^"']*["']""", r'\g<1>"1.0.2"', content, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit(f"Could not safely update version fields in {gradle_file}")
          gradle_file.write_text(content)
          print(f"Configured {gradle_file}: versionCode=4, versionName=1.0.2")
          PY

      - name: Configure permanent release signing
        working-directory: piranshahr-weather-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path("app/build.gradle.kts"), Path("app/build.gradle")]
          gradle_file = next((p for p in candidates if p.is_file()), None)
          if gradle_file is None:
              raise SystemExit("App module Gradle file not found")
          if gradle_file.suffix == ".kts":
              signing = """

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          """
          else:
              signing = """

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          """
          original = gradle_file.read_text()
          if "ANDROID_KEYSTORE_PATH" not in original:
              gradle_file.write_text(original + signing)
          print(f"Configured permanent release signing in {gradle_file}")
          PY

      - name: Read Android app version
        id: app_version
        working-directory: piranshahr-weather-android
        shell: bash
        run: |
          GRADLE_FILE=$(find app -maxdepth 1 -type f \( -name 'build.gradle.kts' -o -name 'build.gradle' \) | head -n1)
          VERSION_NAME=$(sed -nE "s/.*versionName[[:space:]]*=?[[:space:]]*['\"]([^'\"]+)['\"].*/\1/p" "$GRADLE_FILE" | head -n1)
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from $GRADLE_FILE"
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Building Piranshahr Weather v$VERSION_NAME"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Remove obsolete debug APK from this version
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.app_version.outputs.tag }}
        run: |
          if gh release view "$CURRENT_TAG" >/dev/null 2>&1; then
            gh release delete-asset "$CURRENT_TAG" app-debug.apk --yes || true
          fi

      - name: Prepare permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mobin-apps-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mobin-apps-release.jks" >> "$GITHUB_ENV"

      - name: Fix notification launcher resource reference
        working-directory: piranshahr-weather-android
        run: |
          sed -i 's/R\.mipmap\.ic_launcher/R.drawable.ic_launcher/g' app/src/main/java/com/example/weather/NotificationHelper.kt

      - name: Build signed release APK
        working-directory: piranshahr-weather-android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease -x lintVitalRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Piranshahr-Weather-APK
          path: piranshahr-weather-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish versioned APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: Piranshahr Weather v${{ steps.app_version.outputs.name }}
          body: |
            ## Piranshahr Weather v${{ steps.app_version.outputs.name }}

            Latest Android APK for Piranshahr Weather.

            - **Version:** ${{ steps.app_version.outputs.name }}
            - **File:** app-release.apk

            Each release tag represents the app version. Rebuilding the same version updates this release instead of creating another numbered build.
          files: piranshahr-weather-android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
          fail_on_unmatched_files: true

      - name: Keep only the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.app_version.outputs.tag }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "$CURRENT_TAG" ]; then
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
