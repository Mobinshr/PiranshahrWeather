name: Build Qandil Weather APK v3.1.0
on:
  push:
    branches:
      - main
    paths:
      - 'PiranshahrWeather-GitHub.zip'
      - 'redesign-weather.py'
      - 'weather-ios.html'
      - 'qandil_icon.xml'
      - '.github/workflows/build-apk.yml'
      - 'package.json'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned TypeScript compiler
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Compile and test TypeScript weather core
        run: |
          npm run build:core
          npm run test:core

      - name: Extract Android project
        run: |
          test -f PiranshahrWeather-GitHub.zip
          unzip -q -o PiranshahrWeather-GitHub.zip -d .
          test -f piranshahr-weather-android/settings.gradle.kts
          test -f piranshahr-weather-android/app/src/main/AndroidManifest.xml

      - name: Install Qandil weather interface
        working-directory: piranshahr-weather-android
        run: python3 ../redesign-weather.py

      - name: Apply Qandil app branding and launcher icon
        working-directory: piranshahr-weather-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          text = re.sub(r'android:label="[^"]*"', 'android:label="آب‌وهوای قندیل"', text, count=1)
          text = re.sub(r'android:icon="[^"]*"', 'android:icon="@drawable/ic_launcher"', text, count=1)
          text = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@drawable/ic_launcher"', text, count=1)
          manifest.write_text(text, encoding="utf-8")
          icon = Path("app/src/main/res/drawable/ic_launcher.xml")
          icon.parent.mkdir(parents=True, exist_ok=True)
          icon.write_text(Path("../qandil_icon.xml").read_text(encoding="utf-8"), encoding="utf-8")
          print("Qandil app name and launcher icon installed.")
          PY

      - name: Configure Android location permissions
        working-directory: piranshahr-weather-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          permissions = [
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
          ]
          additions = "".join(
              f'    <uses-permission android:name="{permission}" />\n'
              for permission in permissions
              if permission not in text
          )
          if additions:
              end = text.find(">", text.find("<manifest"))
              if end < 0:
                  raise SystemExit("Invalid AndroidManifest.xml")
              text = text[:end + 1] + "\n" + additions + text[end + 1:]
              path.write_text(text, encoding="utf-8")
          print("Android location permissions declared.")
          PY

      - name: Inspect native notification bridge (temporary)
        working-directory: piranshahr-weather-android
        run: |
          echo '--- AndroidBridge.kt ---'
          sed -n '1,240p' app/src/main/java/com/example/weather/AndroidBridge.kt
          echo '--- MainActivity.kt ---'
          sed -n '1,260p' app/src/main/java/com/example/weather/MainActivity.kt
          echo '--- NotificationHelper.kt ---'
          sed -n '1,240p' app/src/main/java/com/example/weather/NotificationHelper.kt

      - name: Validate replacement weather app
        working-directory: piranshahr-weather-android
        run: python3 ../tools/validate_project.py

      - name: Set Android app version
        working-directory: piranshahr-weather-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("app/build.gradle.kts"), Path("app/build.gradle")]
          gradle_file = next((p for p in candidates if p.is_file()), None)
          if gradle_file is None:
              raise SystemExit("App module Gradle file not found")
          content = gradle_file.read_text()
          content, code_count = re.subn(r"(?m)(\bversionCode\s*(?:=\s*)?)\d+", r'\g<1>17', content, count=1)
          content, name_count = re.subn(r"""(?m)(\bversionName\s*(?:=\s*)?)["'][^"']*["']""", r'\g<1>"3.1.0"', content, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit(f"Could not safely update version fields in {gradle_file}")
          gradle_file.write_text(content)
          print(f"Configured {gradle_file}: versionCode=17, versionName=3.1.0")
          PY

      - name: Configure permanent release signing
        working-directory: piranshahr-weather-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path("app/build.gradle.kts"), Path("app/build.gradle")]
          gradle_file = next((p for p in candidates if p.is_file()), None)
          if gradle_file is None:
              raise SystemExit("App module Gradle file not found")
          if gradle_file.suffix == ".kts":
              signing = """

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          """
          else:
              signing = """

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          """
          original = gradle_file.read_text()
          if "ANDROID_KEYSTORE_PATH" not in original:
              gradle_file.write_text(original + signing)
          print(f"Configured permanent release signing in {gradle_file}")
          PY

      - name: Read Android app version
        id: app_version
        working-directory: piranshahr-weather-android
        shell: bash
        run: |
          GRADLE_FILE=$(find app -maxdepth 1 -type f \( -name 'build.gradle.kts' -o -name 'build.gradle' \) | head -n1)
          VERSION_NAME=$(sed -nE "s/.*versionName[[:space:]]*=?[[:space:]]*['\"]([^'\"]+)['\"].*/\1/p" "$GRADLE_FILE" | head -n1)
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from $GRADLE_FILE"
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Building Piranshahr Weather v$VERSION_NAME"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Remove obsolete debug APK from this version
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.app_version.outputs.tag }}
        run: |
          if gh release view "$CURRENT_TAG" >/dev/null 2>&1; then
            gh release delete-asset "$CURRENT_TAG" app-debug.apk --yes || true
          fi

      - name: Prepare permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mobin-apps-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mobin-apps-release.jks" >> "$GITHUB_ENV"

      - name: Fix notification launcher resource reference
        working-directory: piranshahr-weather-android
        run: |
          sed -i 's/R\.mipmap\.ic_launcher/R.drawable.ic_launcher/g' app/src/main/java/com/example/weather/NotificationHelper.kt

      - name: Build signed release APK
        working-directory: piranshahr-weather-android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease -x lintVitalRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Piranshahr-Weather-APK
          path: piranshahr-weather-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish versioned APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: آب‌وهوای قندیل v${{ steps.app_version.outputs.name }}
          body: |
            ## آب‌وهوای قندیل v${{ steps.app_version.outputs.name }}

            APK اندروید برنامهٔ آب‌وهوای قندیل.

            - **Version:** ${{ steps.app_version.outputs.name }}
            - **File:** app-release.apk

            - Kotlin: لایهٔ native اندروید و اعلان‌ها
            - TypeScript: هستهٔ منطق هواشناسی
            - Python: ادغام و کنترل کیفیت پروژه
            - HTML/CSS: رابط کاربری

            بازسازی همین نسخه، فایل انتشار موجود را به‌روزرسانی می‌کند و نسخهٔ تکراری نمی‌سازد.
          files: piranshahr-weather-android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
          fail_on_unmatched_files: true

      - name: Keep only the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.app_version.outputs.tag }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "$CURRENT_TAG" ]; then
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
