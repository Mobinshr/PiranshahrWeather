name: Build Piranshahr Weather APK
on:
  push:
    branches:
      - main
    paths:
      - 'PiranshahrWeather-GitHub.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          test -f PiranshahrWeather-GitHub.zip
          unzip -q -o PiranshahrWeather-GitHub.zip -d .
          test -f piranshahr-weather-android/settings.gradle.kts
          test -f piranshahr-weather-android/app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Fix notification launcher resource reference
        working-directory: piranshahr-weather-android
        run: |
          sed -i 's/R\.mipmap\.ic_launcher/R.drawable.ic_launcher/g' app/src/main/java/com/example/weather/NotificationHelper.kt

      - name: Build APK
        working-directory: piranshahr-weather-android
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Piranshahr-Weather-APK
          path: piranshahr-weather-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: Piranshahr Weather - Latest APK
          body: |
            Latest automatically built APK for Piranshahr Weather.
            Download app-debug.apk and install it on your Android device.
          files: piranshahr-weather-android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          fail_on_unmatched_files: true

      - name: Keep only the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          while IFS= read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "$current_tag" ]; then
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
